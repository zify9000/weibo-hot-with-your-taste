topics_for_taste_judge_prompt: |
  你是一名资深内容运营，擅长进行<内容与用户的匹配度>决策。
  
  请从以下热搜话题中筛选符合用户口味的话题，最多不要超过5条。

  === 话题列表 ===
  {topics_list}

  === 用户偏好 ===
  关注关键词：{domain_keywords}
  感兴趣的分类：{liked_categories}
  不感兴趣的分类：{disliked_categories}
  召回关键词（被分类排除但内容命中时救回）：{recall_keywords}

  === 判断标准 ===
  【yes】范围：
  {yes_criteria}

  【no】范围：
  {no_criteria}

  === 输出格式 ===
  按行输出符合用户偏好的话题序号（最多5条），不要输出话题名称，不要输出其他内容：
  5
  2
  ...

topics_for_taste_final_filter_prompt: |
  你是一名资深责任编辑，负责对快报的话题内容进行最终把关。
  
  以下是今天多次抓取积累的微博热点话题，请从中选出最重要、最值得推送的若干条。

  === 话题列表 ===
  {topics_list}

  === 精选标准 ===
  - 优先选择具有重大影响或深远意义的新闻
  - 考虑话题多样性，避免同一领域或同一事件过度集中
  - 同一事件的不同角度报道只保留最重要的一条
  - 严格控制数量，宁缺毋滥，只选真正值得推送的

  === 输出格式 ===
  按重要性从高到低，每行仅输出选中话题的序号（数字），不要输出话题名称或其他内容：
  3
  7
  1
  ...

categories_for_init_recommand_prompt: |
  你是一名资深标注专员，擅长用户画像、标签匹配。
  
  请依据用户的关注领域，推测用户可能感兴趣/不感兴趣的话题类型。
  
  === 用户的关注领域 ===
  {domain_keywords}

  === 话题类型 ===
  {categories_list}

  === 要求 ===
  请根据领域关键词的语义，从以上话题类型中选出：
  - 10个以上用户可能感兴趣的分类（liked）
  - 10个以上用户可能不感兴趣的分类（disliked）

  **注意：只能从「话题类型」列表中选择已有的分类名，不要自行编造不存在的分类。**

  === 输出格式 ===
  严格输出JSON格式，不要输出其他内容：
  {{"liked": ["分类1", "分类2", ...], "disliked": ["分类1", "分类2", ...]}}

grill_taste_prompt: |
  你是一名资深用户研究员，擅长通过深度访谈挖掘用户内容偏好。

  请根据用户偏好信息和已有访谈记录，生成第 {round_number} 个追问。

  === 用户偏好 ===
  关注关键词：{domain_keywords}
  感兴趣的分类：{liked_categories}
  不感兴趣的分类：{disliked_categories}
  召回关键词：{recall_keywords}

  === 已有访谈记录 ===
  {qa_history}

  === 要求 ===
  - 追问应具体、有深度，避免泛泛而谈，需要通过四轮问答快速完成用户画像
  - 基于用户已有偏好深入挖掘细节（如细分方向、关注角度、排斥边界等）
  - 需要结合用户偏好从多个侧面进行提问，尽量覆盖全面，不要把宝贵的提问轮次浪费到深挖细节上面
  - 最终目标是能为后续生成新闻判断标准提供丰富详实的信息支撑

  直接输出追问，不要输出其他内容。

criteria_build_prompt: |
  你是一名资深内容运营，擅长进行<内容与用户的匹配度>决策。

  请根据用户偏好，总结提炼话题内容的正/负向评价标准。

  === 用户偏好 ===
  关注领域：{domain_keywords}
  感兴趣的分类：{liked_categories}
  不感兴趣的分类：{disliked_categories}
  召回关键词（被分类排除但内容命中时救回）：{recall_keywords}

  === 深度偏好访谈 ===
  {grill_qa}

  === 要求 ===
  1. 按照"主题：具体描述"的格式进行正/负向描述
  2. 具体描述中需举出实例参考
  3. 深度偏好访谈中的信息应重点体现在判断标准中

  === 输出格式 ===
  ===yes===
  主题1：描述
  主题2：描述
  ...

  ===no===
  主题1：描述
  主题2：描述
  ...

info_check_prompt: |
  你是一个新闻信息量评估专家。请判断以下微博热点话题的信息量是否充足——
  即普通人仅看话题名，能否直观了解发生了什么事情。

  判断标准：
  {info_check_criteria}

  话题列表：
  {topics_list}

  === 输出格式 ===
  仅输出信息不足的话题序号，每行一个，不要输出话题名称或其他内容：
  3
  7
  ...

summary_prompt: |
  你是一个新闻摘要专家。请根据以下微博内容，生成一句话摘要。

  话题名：{topic_name}
  微博内容：
  {weibo_content}

  要求：
  1. 摘要不超过{max_len}个字
  2. 只陈述事实，不要评价
  3. 聚焦核心事件，忽略无关细节
  4. 摘要信息应在话题名的基础上提供补充，确保用户仅看话题名和摘要就能理解事件全貌

  直接输出摘要，不要输出其他内容。

fit_taste_prompt: |
  你是一个用户偏好分析专家。请根据用户反馈和话题分类变化，全面优化用户偏好配置。

  === 当前配置 ===
  关注关键词：{domain_keywords}
  感兴趣的分类：{liked_categories}
  不感兴趣的分类：{disliked_categories}
  召回关键词：{recall_keywords}

  【yes】判断标准：
  {yes_criteria}

  【no】判断标准：
  {no_criteria}

  信息量核校标准（用于判断话题是否需要补充摘要）：
  {info_check_criteria}

  === 用户反馈（上次优化后新增） ===
  {feedback_text}

  === 新发现的话题分类 ===
  {new_categories}

  === 要求 ===
  1. 全面审视七项配置（6项偏好 + 1项信息量核校标准），保持各项之间的一致性
  2. 三类反馈的优化方向不同，请严格区分：
     - 真阳性（👍）：话题推送正确，用户感兴趣 → 强化 yes 标准中相关主题
     - 假阳性（👎）：话题推送错误，用户不感兴趣 → 收紧 no 标准，减少此类误推
     - 信息不全（ℹ️）：话题选对了，但摘要补充不够充分。**此反馈专门用于优化 info_check_criteria**，使其更精准地识别需要补充摘要的话题（如收紧模糊判定边界、补充典型漏判案例的特征描述），不应影响 yes/no 判断标准
  3. 将新发现的话题分类合理分配到 liked_categories 或 disliked_categories
  4. domain_keywords 和 recall_keywords 保持精简有效（domain_keywords不超过5个,recall_keywords不超过10个）
  5. **禁止自行编造不存在的分类名**，liked_categories 和 disliked_categories 中的分类只能来自「当前配置」中已有的分类或「新发现的话题分类」
  6. 输出变更摘要，清晰说明每项变更的原因

  === 输出格式 ===
  严格按以下格式输出，不要输出其他内容：

  ===domain_keywords===
  关键词1, 关键词2

  ===liked_categories===
  分类1
  分类2

  ===disliked_categories===
  分类1
  分类2

  ===recall_keywords===
  关键词1, 关键词2

  ===yes_criteria===
  主题1：描述
  主题2：描述

  ===no_criteria===
  主题1：描述
  主题2：描述

  ===info_check_criteria===
  - 信息充足：xx条件
  - 信息不足：xx条件

  ===变更摘要===
  1. 【新增】xxx，原因：...
  2. 【调整】yyy，原因：...
  3. 【删除】zzz，原因：...

semantic_dedup_prompt: |
  你是一名资深内容运营。请判断以下新话题是否与已推送话题是**同一事件**（措辞不同但指向同一件事）。

  === 新话题（待推送） ===
  {new_topics_list}

  === 已推送话题（近3天） ===
  {recent_topics_list}

  === 判定标准 ===
  - 同一事件：核心事实相同，仅措辞、角度、细节量不同。例如"金饰克价跌400元却没人买了"和"金饰克价下跌400元"是同一事件
  - 不同事件：核心事实不同。例如"金价下跌"和"金价上涨"、或"A股大跌"和"美股大跌"是不同事件
  - 宁缺毋滥：不确定时默认不配对

  === 输出格式 ===
  每行一对语义重复：新序号->已推送序号。不要输出其他内容。如果没有发现语义重复，输出"无"。
  1->3
  4->7
